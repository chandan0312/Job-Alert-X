<!doctype html>
<html lang="en-IN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4WPNYQW5Z5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-4WPNYQW5Z5');
    </script>

    <!-- Google AdSense - preconnect for faster ad loading -->
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin />
    <link rel="preconnect" href="https://adservice.google.com" crossorigin />
    <link rel="preconnect" href="https://googleads.g.doubleclick.net" crossorigin />
    <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />
    <link rel="dns-prefetch" href="https://adservice.google.com" />
    <link rel="dns-prefetch" href="https://googleads.g.doubleclick.net" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3267638418796867"
      crossorigin="anonymous"
    ></script>

    <!--
      ============================================================
      PRIMARY META TAGS
      NOTE: Title, description, canonical, og:*, twitter:*, and
      JSON-LD are injected dynamically per-page by SEOHead.jsx.
      The shell below provides safe fallback values only.
      ============================================================
    -->
    <title>Job Alert X — Latest Govt Jobs, Sarkari Naukri, Admit Card &amp; Result</title>
    <meta
      name="description"
      content="Job Alert X — Get latest govt job notifications, new vacancy 2026, admit cards, results, answer keys for SSC, Railway, Banking, UPSC, Police, Defence across all states of India."
    />

    <!--
      IMPORTANT: No hardcoded canonical here.
      Each page sets its own canonical via SEOHead.jsx useEffect.
      A hardcoded canonical in this shell would incorrectly declare
      every page as the homepage for first-pass Googlebot crawls.
    -->

    <!-- Open Graph fallback (overridden per-page by SEOHead.jsx) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Job Alert X" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://jobalertx.com/og-image.png" />

    <!-- Twitter Card fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://jobalertx.com/og-image.png" />

    <!-- Robots: allow indexing; per-page noindex is added via SEOHead where needed -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Theme -->
    <meta name="theme-color" content="#050814" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="author" content="Job Alert X Editorial Team" />

    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="T8bA9mhWDwp0IjmJOVnL_fB1Ei8XSYOfgWQYu2qOpgo" />

    <!-- Publisher & Content Identity — AdSense E-E-A-T trust signals -->
    <meta name="publisher" content="Job Alert X" />
    <meta name="language" content="en-IN" />
    <meta http-equiv="content-language" content="en-IN" />
    <meta name="geo.region" content="IN" />
    <meta name="geo.country" content="India" />
    <meta name="classification" content="Government Jobs, Recruitment, Career" />
    <meta name="category" content="Jobs &amp; Career" />
    <meta name="coverage" content="India" />
    <meta name="rating" content="general" />

    <!-- Font Performance: DNS prefetch + preconnect + preload for Google Fonts (Inter) -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v19/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuLyfAZ9hjp-Ek-_EeA.woff2" />
    <!-- Font loading via CSS @font-face with font-display: swap (see index.css) -->

    <!--
      JSON-LD for WebSite + Organization is injected by Home.jsx via SEOHead.jsx.
      It is intentionally NOT duplicated here to avoid duplicate structured data.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
